# rx-assistant frontend — SPA static + /api/* proxy to the backend service.
#
# Load-bearing: `proxy_buffering off` in the /api/ block. Without it nginx
# buffers the SSE response and the browser only receives the full payload at
# stream close — catastrophic for an SSE-driven chat. We also strip the
# `Connection: close` header from the proxied response so keep-alive holds.
#
# The upstream host `backend` resolves via docker-compose's internal DNS.

server {
    listen      80;
    server_name _;

    # Static SPA shell. `try_files` lets react-router-dom v7's BrowserRouter
    # serve the same index.html for /c/:id, /__components, etc.
    root        /usr/share/nginx/html;
    index       index.html;

    # Reasonable text-asset gzip; binary assets (woff2, png) are already
    # compressed by Vite or the source.
    gzip                on;
    gzip_types          text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length     1024;

    # SSE-friendly proxy to the backend's /api/*. The trailing slash on
    # `proxy_pass` strips /api so the upstream sees /chat, /conversations, etc.
    # — but our backend mounts under /api itself, so we keep the prefix.
    location /api/ {
        proxy_pass              http://backend:8787;
        proxy_http_version      1.1;
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;

        # SSE specifics — keep the stream open and don't buffer.
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      24h;
        proxy_send_timeout      24h;
        chunked_transfer_encoding on;
    }

    # SPA fallback — every other route serves index.html so React Router
    # owns the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
